# ─────────────────────────────────────────────
# Kitty Config — Firstp1ck/Hyprland-Simple-Setup look
# (Nord/Rosé-Pine palette, 80% transparency, FiraCode Retina,
#  VDawg background) + kept: cursor trail, ctrl+shift maps.
# Black+red backup: ~/.local/share/noctalia-cleanup-quarantine-2026-09-29/kitty.conf.black-red-backup
# Reload live: Ctrl+Shift+F5 (or Ctrl+Shift+R)
# ─────────────────────────────────────────────

kitty_mod ctrl+shift

# ────────────────
# FONT
# ────────────────
font_family        JetBrainsMono Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          13.5
disable_ligatures  never
adjust_line_height 1

# ────────────────
# TRANSPARENCY & BACKGROUND (cat-left.png = cat anchored left,
# phthalo-green canvas matched to background #042019 below)
# ────────────────
background_opacity      0.82
background_image        ~/.config/kitty/Background/cat-left.png
background_image_layout scaled
background_tint         0.68

# ────────────────
# SPACING & LAYOUT
# ────────────────
window_padding_width    6
window_margin_width     0
window_border_width     1px
hide_window_decorations titlebar-only

# ────────────────
# PERFORMANCE
# ────────────────
repaint_delay        6
input_delay          1
sync_to_monitor      no
enable_audio_bell    no
window_alert_on_bell yes
bell_on_tab          no

# ────────────────
# CURSOR
# ────────────────
cursor_shape               block
cursor_blink_interval      0
cursor_trail               12
cursor_trail_decay         0.015 0.20

# ────────────────
# NEUTRAL BASE, GREEN×PURPLE ACCENTS (cat-bg-learninglab)
# ────────────────
foreground           #d8e4de
background           #0a0f0d
selection_foreground #0a0f0d
selection_background #b388eb
url_color            #66ffd0
cursor               #45e0a8

color0   #1c2521
color8   #31403a
color1   #f06e9e
color9   #ff8fbe
color2   #37b783
color10  #5fd7a7
color3   #f5d76e
color11  #ffe9a0
color4   #4fa8a0
color12  #7fd8d0
color5   #a97fd9
color13  #c9a0ff
color6   #52e8c4
color14  #8ff5dd
color7   #d8e4de
color15  #ffffff

# ────────────────
# TAB BAR (powerline, bottom)
# ────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   angled
tab_bar_min_tabs      1
tab_bar_align         left
active_tab_foreground #042019
active_tab_background #a97fd9
active_tab_font_style bold
inactive_tab_foreground #7fb89e
inactive_tab_background #131a16
inactive_tab_font_style normal

# ────────────────
# WINDOW BORDERS
# ────────────────
active_border_color   #a97fd9
inactive_border_color #1c2521

# ────────────────
# SCROLL & INPUT FEEL
# ────────────────
scrollback_lines        10000
copy_on_select          yes
strip_trailing_spaces   always
mouse_hide_wait         1.5
wheel_scroll_multiplier 2.5

# ────────────────
# INTEGRATION
# ────────────────
shell_integration       enabled no-cursor
update_check_interval   0
allow_hyperlinks        yes

# ────────────────
# KEYMAPS (Firstp1ck + Ivan's ctrl+shift set)
# ────────────────
map kitty_mod+r reload_config
map ctrl+v paste_from_clipboard

# Tabs
map kitty_mod+y new_tab
map alt+y close_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Windows (inside kitty)
map kitty_mod+x new_window_with_cwd
map alt+x close_window
map alt+v toggle_layout tall
map alt+s toggle_layout grid
map alt+h neighboring_window left
map alt+j neighboring_window bottom
map alt+k neighboring_window top
map alt+l neighboring_window right
map alt+shift+h move_window left
map alt+shift+j move_window bottom
map alt+shift+k move_window top
map alt+shift+l move_window right
map kitty_mod+f4 detach_window ask

# Font size
map ctrl+1 change_font_size all +2.0
map ctrl+2 change_font_size all -2.0
map ctrl+equal       change_font_size all +1.0
map ctrl+plus        change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# Scroll
map page_up scroll_page_up
map page_down scroll_page_down
map shift+page_up combine : scroll_page_up : scroll_page_up : scroll_page_up
map shift+page_down combine : scroll_page_down : scroll_page_down : scroll_page_down

# Ivan's originals kept
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+enter new_window
map ctrl+shift+q close_window
