[notification]
monitors = [ "DP-1" ]
position = "top_right"

[plugin_settings."noctalia/wallhaven"]
api_key = ""  # scrubbed from repo 2026-09-30 — re-enter your wallhaven key

[plugins]
enabled = [
    "dotnetrob/cat",
    "vn1k/cursor",
    "yocraft/desktop-launcher",
    "blackbartblues/keymap",
    "tordex/processes",
    "estvoid/sony_headphones",
    "tmelik/system-monitor",
    "cleboost/zed-provider",
    "icefish/phone-connect",
    "azokyen/spotify-media",
    "kenn/keybind-cheatsheet",
    "srounce/systemd",
    "zyrex/run-path",
    "thaer99ob/default-apps",
    "noctalia/wallhaven",
    "noctalia/notes",
    "ivan/bt-call-profile"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/ivan/.local/share/noctalia-plugins-local"
    name = "local"

[shell]
panel_anchor_bar = "default"
settings_show_advanced = false

    [shell.launcher]
    app_grid = true
    show_app_actions = true

    [shell.panel]
    list_item_background = true
    open_near_click_wallpaper = true
    transparency_mode = "glass"

    [shell.screenshot]
    confirm_region = true
    remember_last_region = true
    show_cursor = true

    [shell.session]
    grid = true

[theme]
builtin = "Ayu"
community_palette = "Ayu Green"
mode = "dark"
shell_mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop" ]
    community_ids = [ "brave", "fuzzel" ]

[wallpaper.default]
path = "/home/ivan/Pictures/wallhaven-p8j8je.jpg"

[wallpaper.last]
path = "/home/ivan/Pictures/wallhaven-p8j8je.jpg"

[wallpaper.monitors.DP-1]
path = "/home/ivan/Pictures/wallhaven-p8j8je.jpg"

[wallpaper.monitors.HDMI-A-2]
path = "/home/ivan/Pictures/wallhaven-p8j8je.jpg"

[widget.bt-call-profile]
type = "ivan/bt-call-profile:bt-call-profile"

[widget.cat]
cat_color = "primary"
cat_color_mode = "custom"
cat_size = 48
show_cpu_percent = true
type = "dotnetrob/cat:cat"
walk_threshold = 11

[widget.media]
font_scale = 0.90000000000000013
max_length = 254
scale = 1.1000000000000001
show_progress = true

[widget.notes]
type = "noctalia/notes:notes"

[widget.sony_headphones]
type = "estvoid/sony_headphones:sony_headphones"

[widget.volume]
custom_image_colorize = true

    [widget.volume.actions]
    middle = "exec /home/ivan/.local/bin/bt-profile-set toggle"
    right = "volume-mute"