config_version = 14

[audio]
enable_overdrive = true
sound_volume = 0.40000000000000002

[bar.default.monitor.DP-1]
enabled = false
radius = 0

[bar.default.monitor.HDMI-A-2]
background_opacity = 0.72999998368322849
capsule = true
concave_edge_corners = false
contact_shadow = true
end = [
    "sony_headphones",
    "media",
    "tray",
    "notifications",
    "clipboard",
    "keyboard_layout",
    "network",
    "bluetooth",
    "volume",
    "bt-call-profile",
    "battery",
    "sysmon",
    "control-center",
    "session"
]
font_scale = 0.79999998956918716
margin_ends = 0
radius = 15
start = [ "cat", "launcher", "notes", "nightlight" ]
thickness = 24

[calendar]
enabled = true

[dock]
active_monitor_only = true
auto_hide = true
enabled = true
launcher_icon = "cat"
launcher_position = "start"
layer = "overlay"
monitors = [ "HDMI-A-2" ]
pinned = [ "zen", "zcode", "kitty", "cursor", "spotify", "dev.zed.Zed", "org.kde.dolphin" ]
position = "left"
reserve_space = false
show_dots = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 15

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

